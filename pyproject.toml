[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "secureprobe"
version         = "2.0.0"
description     = "Web security audit tool — 16 scan modules, HTML/text reports, CLI"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.8"

authors = [
  { name = "Sa3d-99" },
]

keywords = [
  "security", "web-security", "audit", "scanner",
  "ssl", "cors", "headers", "penetration-testing",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
  "requests>=2.28",
  "colorama>=0.4",
  "urllib3>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov",
  "ruff",
]

[project.scripts]
secureprobe = "secureprobe.__main__:main"

[project.urls]
Homepage   = "https://github.com/Sa3d-99/secureprobe"
Repository = "https://github.com/Sa3d-99/secureprobe"
Issues     = "https://github.com/Sa3d-99/secureprobe/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py38"
